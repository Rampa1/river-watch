<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
      .grp{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .h{font-size:17px;font-weight:600;fill:#0f172a}
      .s{font-size:13px;fill:#334155}
      .t{font-size:12px;fill:#64748b}
      .lab{font-size:12px;fill:#334155;font-weight:600}
      .ln{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#arr)}
      .ln2{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#arr);stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1280" height="860" fill="#ffffff"/>
  <text x="30" y="42" font-size="24" font-weight="700" fill="#0f172a">River Watch: architecture</text>
  <text x="30" y="66" class="t">A static GitHub Pages site: the page code reads live data, applies the Flood Plan, and Claude explains. The key stays in the user's own browser.</text>

  <!-- trust boundary -->
  <line x1="290" y1="90" x2="290" y2="640" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 5"/>
  <text x="30" y="104" class="t">PEOPLE AND WHAT THEY SEE</text>
  <text x="300" y="104" class="t">IN THE BROWSER: github.io page, no server</text>

  <!-- people -->
  <rect x="30" y="118" width="230" height="150" rx="10" class="grp"/>
  <text x="46" y="146" class="h">Who asks</text>
  <text x="46" y="174" class="s">Duty Officer (by 16:00)</text>
  <text x="46" y="192" class="t">"Tonight's plan?" "Why Fermoy?"</text>
  <text x="46" y="208" class="t">"What if the Suir hits 150 m³/s?"</text>
  <text x="46" y="234" class="s">Area Manager</text>
  <text x="46" y="252" class="t">"Which town first for a study?"</text>

  <!-- page -->
  <rect x="30" y="330" width="230" height="230" rx="10" class="box" stroke="#2563eb"/>
  <text x="46" y="358" class="h" fill="#1d4ed8">Page view (github.io)</text>
  <text x="46" y="384" class="s">Tonight's level per town</text>
  <text x="46" y="403" class="s">Crew allocation + flags</text>
  <text x="46" y="422" class="s">Question box</text>
  <text x="46" y="441" class="s">Every number with its source</text>
  <text x="46" y="460" class="s">and "rehearsal value" labels</text>
  <text x="46" y="479" class="s">"AI can make mistakes; a person</text><text x="46" y="496" class="s">makes the final decision."</text>
  <text x="46" y="524" class="t">Person decides and records</text>
  <text x="46" y="540" class="t">the reason (Flood Plan Rule 1)</text>

  <path d="M145,268 L145,326" class="ln"/>
  <text x="153" y="302" class="lab">asks / reads</text>

  <!-- server -->
  <rect x="320" y="118" width="480" height="522" rx="12" class="grp" stroke="#0f172a"/>
  <text x="338" y="146" class="h">Page code (JavaScript)</text>
  <text x="540" y="146" class="t">(runs in the user's browser)</text>

  <rect x="338" y="160" width="444" height="44" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="352" y="180" class="lab" fill="#92400e">Settings box: user pastes / saves / forgets own key</text><text x="352" y="197" class="t" fill="#92400e">Stored in this browser only (localStorage); never in repo or page source</text>

  <rect x="338" y="220" width="444" height="170" rx="8" class="box"/>
  <text x="352" y="246" class="h">1. Flood Plan rules in code</text>
  <text x="352" y="270" class="s">Forecast peak = max(today, +1, +2 days)</text>
  <text x="352" y="289" class="s">vs town's own P95 / P99 → Normal / Standby / Barriers</text>
  <text x="352" y="308" class="s">Orange/red rain warning in next 48 h → +1 level</text>
  <text x="352" y="327" class="s">Overrides from Sheet = rehearsal values (Rule 5)</text>
  <text x="352" y="346" class="s">Crews: 3 crews × 2 towns, areas, ranking (Rule 6)</text>
  <text x="352" y="365" class="s">No barrier set → Standby + flag (Rule 7)</text>

  <rect x="338" y="406" width="444" height="104" rx="8" class="box"/>
  <text x="352" y="432" class="h">2. Ask Claude to explain</text>
  <text x="352" y="456" class="s">Sends the computed plan + question, not raw history</text>
  <text x="352" y="475" class="s">Out of scope or no data → says so (Rule 9)</text>
  <text x="352" y="494" class="s">max_tokens 4,000 per answer</text>

  <rect x="338" y="526" width="444" height="96" rx="8" class="box"/>
  <text x="352" y="552" class="h">3. Reply to the page</text>
  <text x="352" y="576" class="s">Answer + every number's source and time</text>
  <text x="352" y="595" class="s">Flags any rehearsal value or code/headline mismatch</text>

  <!-- page <-> server -->
  <path d="M262,420 L334,420" class="ln"/>
  <text x="264" y="410" class="lab">question</text>
  <path d="M336,574 C300,574 300,520 264,520" class="ln"/>
  <text x="268" y="600" class="lab">answer</text>

  <!-- live sources -->
  <rect x="870" y="118" width="380" height="286" rx="12" class="grp" stroke="#15803d"/>
  <text x="888" y="146" class="h" fill="#15803d">Live sources (read at request time)</text>

  <rect x="888" y="160" width="344" height="72" rx="8" class="box"/>
  <text x="902" y="184" class="lab">Open-Meteo Flood API (GloFAS)</text>
  <text x="902" y="203" class="t">river_discharge forecast, 8 river cells</text>
  <text x="902" y="220" class="t">CC BY 4.0, "Weather data by Open-Meteo.com"</text>

  <rect x="888" y="242" width="344" height="72" rx="8" class="box"/>
  <text x="902" y="266" class="lab">Met Éireann warnings JSON</text>
  <text x="902" y="285" class="t">regions EIxx codes → counties (+ Roscommon)</text>
  <text x="902" y="302" class="t">Custom open licence: text unaltered, expired removed</text>

  <rect x="888" y="324" width="344" height="68" rx="8" class="box"/>
  <text x="902" y="348" class="lab">Google team Sheet (11 columns)</text>
  <text x="902" y="367" class="t">resources, notes, flow/warning overrides</text>
  <text x="902" y="383" class="t">edit a number → advice changes on next ask</text>

  <path d="M784,290 L866,290" class="ln"/>
  <text x="792" y="280" class="lab">fetch</text>

  <!-- anthropic -->
  <rect x="870" y="440" width="380" height="150" rx="12" class="box" stroke="#7c3aed"/>
  <text x="888" y="468" class="h" fill="#6d28d9">The brain: Anthropic Claude API</text>
  <text x="888" y="494" class="s">claude-sonnet-5-5, effort low/medium</text>
  <text x="888" y="514" class="s">≈ $0.02 per answer, ≈ $3–4 per month</text>
  <text x="888" y="540" class="t">Key from a dedicated workspace; spend limits:</text>
  <text x="888" y="557" class="t">workspace and organisation (e.g. $10/month)</text>
  <text x="888" y="574" class="t">→ a leaked key cannot spend more than funded</text>

  <path d="M784,458 L866,458" class="ln"/>
  <text x="790" y="448" class="lab">prompt + key</text>
  <path d="M866,494 L788,494" class="ln"/>
  <text x="800" y="512" class="lab">text</text>

  <!-- stored -->
  <rect x="320" y="690" width="480" height="140" rx="12" class="grp"/>
  <text x="338" y="718" class="h">Stored files (computed once, read each time)</text>
  <text x="338" y="744" class="s">history_summary.json: per-town river cell, P95, P99 (GloFAS 2016–2025)</text>
  <text x="338" y="764" class="s">study_ranking.json: Rule 8 winter events (OPW gauges)</text>
  <text x="338" y="784" class="s">County code table (EI codes, proven / consistent)</text>
  <text x="338" y="812" class="t">No years of daily data sent to the model on any question</text>

  <path d="M560,688 L560,644" class="ln"/>
  <text x="568" y="670" class="lab">read</text>

  <!-- offline build -->
  <rect x="870" y="690" width="380" height="140" rx="12" class="box" stroke-dasharray="6 4"/>
  <text x="888" y="718" class="h">Offline build (scripts in verification/)</text>
  <text x="888" y="744" class="s">Open-Meteo history 2016–2025 (GloFAS)</text>
  <text x="888" y="764" class="s">OPW Hydro-Data gauged flow (CC BY 4.0)</text>
  <text x="888" y="784" class="s">Open-Meteo Geocoding (GeoNames)</text>
  <text x="888" y="812" class="t">Re-run only when the period or river cells change</text>

  <path d="M868,760 L804,760" class="ln2"/>
  <text x="808" y="750" class="lab">once</text>
</svg>
